<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Gracias! — Supratech</title>
  <meta name="robots" content="noindex, follow">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f0f2f5;
      background-image:
        radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%),
        radial-gradient(at 60% 0%, hsla(225,39%,30%,1) 0, transparent 50%);
      background-attachment: fixed;
      min-height: 100vh;
      color: #1a1a2e;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .navbar-logo { text-decoration: none; font-weight: 700; font-size: 1.1em; color: #fff; }
    .navbar a.back { font-size: 0.82em; color: rgba(255,255,255,0.65); text-decoration: none; }
    .navbar a.back:hover { color: #fff; }

    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    }

    .check {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      background: linear-gradient(45deg, #4361ee, #3f37c9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      color: #fff;
    }

    h1 {
      font-size: 1.6em;
      font-weight: 800;
      margin-bottom: 12px;
    }

    p {
      color: #6b7280;
      font-size: 0.98em;
      line-height: 1.65;
      margin-bottom: 28px;
    }

    .home-button {
      display: inline-block;
      padding: 14px 34px;
      background: linear-gradient(45deg, #4361ee, #3f37c9);
      color: #fff;
      text-decoration: none;
      border-radius: 25px;
      font-weight: 700;
      font-size: 1em;
      box-shadow: 0 4px 15px rgba(67,97,238,0.3);
      transition: all 0.3s ease;
    }
    .home-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(67,97,238,0.4);
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="/" class="navbar-logo">Supratech</a>
    <a href="/" class="back">← Volver al inicio</a>
  </nav>

  <div class="main">
    <div class="card">
      <div class="check">✓</div>
      <h1>¡Listo, recibimos tu mensaje!</h1>
      <p>Un asesor de Supratech te contactará en menos de 24 horas para mostrarte cómo automatizar tu cartera, liquidez, inventario y precios.</p>
      <a href="/" class="home-button">Volver al inicio</a>
    </div>
  </div>

</body>
</html>
